<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal · Cloudy</title>
  <link rel="stylesheet" href="cloudy.css">
</head>
<body class="page">
  <div class="shell wide">
    <div class="top">
      <div class="brand">Cloudy · Portal</div>
      <div class="meta" id="who"></div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head">
          <div>
            <h1>Your Teams</h1>
            <p class="lede" id="lede">Loading…</p>
          </div>
          <button type="button" class="secondary" id="refresh">Refresh</button>
        </div>
        <p id="msg" class="msg"></p>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Team Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <p class="foot">
      <a id="adminLink" href="admin/portal.html" hidden>Admin portal</a>
      <a href="#" id="out">Sign out</a>
    </p>
  </div>
  <script src="cloudy.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const rows = document.getElementById("rows");
    let session = null;

    document.getElementById("out").addEventListener("click", (e) => {
      e.preventDefault();
      Cloudy.signOut();
    });

    function setMsg(text, ok) {
      msg.className = "msg " + (ok ? "ok" : "err");
      msg.textContent = text || "";
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function actionBtn(label, fn, cls) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = cls || "secondary";
      b.textContent = label;
      b.addEventListener("click", fn);
      return b;
    }

    async function loadTeams() {
      try {
        const data = await Cloudy.api("/zz/cloudy/my-teams", { headers: Cloudy.headers() });
        rows.innerHTML = "";
        const teams = data.teams || [];
        document.getElementById("lede").textContent = teams.length + " team(s) found";
        teams.forEach((t) => {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + esc(t.id) + "</td>" +
            "<td><strong>" + esc(t.name) + "</strong></td>" +
            "<td>" + esc(t.description) + "</td>" +
            "<td class='actions'></td>";
          const cell = tr.querySelector("td:last-child");
          cell.append(
            actionBtn("Add user", () => { alert("Add user functionality coming soon."); }),
            actionBtn("Browse", () => { location.href = "teams.html?id=" + encodeURIComponent(t.id); }, "primary")
          );
          rows.appendChild(tr);
        });
      } catch (err) {
        setMsg(err.message);
      }
    }

    Cloudy.requireSession().then(async (data) => {
      if (!data) return;
      session = data;
      const user = data.user || {};
      document.getElementById("who").textContent = (user.email || "") + " · " + (user.utype || "");
      if (user.utype === "admin") document.getElementById("adminLink").hidden = false;
      await loadTeams();
    });

    document.getElementById("refresh").addEventListener("click", async () => {
      await loadTeams();
    });
  </script>
</body>
</html>
